<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Holiday Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Explore</a>
    <a href="plans.html">My Plans</a>
  </nav>

  <h1>JomJalan</h1>

  <section>
    <label for="cityInput">Enter a city:</label>
    <input type="text" id="cityInput" placeholder="e.g. Tokyo">
    <button id="searchBtn">Search</button>
    <p id="message"></p>
  </section>

  <section id="cityInfo"></section>
  <section id="timeInfo"></section>
  <section id="weatherInfo"></section>
  <section id="countryInfo"></section>
  <section id="forecastInfo"></section>
  <section id="guideInfo"></section>

  <section id="plannerSection">
    <h3>Plan Your Family Trip</h3>

    <label for="adults">Adults:</label>
    <input type="number" id="adults" min="1" value="2">

    <label for="children">Children (2-11):</label>
    <input type="number" id="children" min="0" value="0">

    <label for="infants">Infants (under 2):</label>
    <input type="number" id="infants" min="0" value="0">

    <label for="seniors">Seniors (60+):</label>
    <input type="number" id="seniors" min="0" value="0">

    <label for="days">Number of days:</label>
    <input type="number" id="days" min="1" value="5">

    <label for="packageSelect">Package:</label>
    <select id="packageSelect"></select>

    <button id="calcBtn">Calculate Cost</button>
    <p id="calcMessage"></p>
    <div id="costResult"></div>

    <button id="suggestBtn">Get Activity Suggestion</button>
    <div id="suggestionResult"></div>

    <label for="notes">Notes:</label>
    <input type="text" id="notes" placeholder="e.g. Book hotel near station">
    <button id="saveBtn">Save Plan</button>
    <p id="saveMessage"></p>
  </section>

  <script src="js/nav.js"></script>
  <script src="js/explore.js"></script>
</body>
</html>
